name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Portable App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set zstandard pywin32

      - name: Build with Nuitka
        shell: pwsh
        run: python -m nuitka --assume-yes-for-downloads app.py

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarLuxe-Windows-Portable
          path: build/app.dist/**
